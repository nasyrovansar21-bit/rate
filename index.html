
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first site</title>
    <style>
        body {
            background: linear-gradient(135deg, #031a3d, #0b3b8c);
            color: #eaf3ff;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: min(90%, 480px);
        }

        p {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1.5;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .enter-button {
            display: inline-block;
            margin-top: 12px;
            padding: 18px 40px;
            border-radius: 12px;
            background: #ffffff;
            color: #0b3b8c;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .enter-button:hover {
            background: #eaf3ff;
            transform: translateY(-2px);
        }

        .enter-button:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <div class="content">
        <p>Welcome to</p>
        <p>my first site</p>

        <a class="enter-button" href="rating.html">Rate the site</a>
    </div>
</body>
</html>
